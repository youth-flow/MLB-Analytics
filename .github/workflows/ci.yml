name: offline-reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-pipeline:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run frozen offline pipeline
        run: python scripts/run_pipeline.py
        env:
          MLB_ANALYTICS_SKIP_FIGURE_RENDER: "1"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Confirm byte-stable rebuild
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            git status --short
            throw "Offline rebuild changed tracked files."
          }
