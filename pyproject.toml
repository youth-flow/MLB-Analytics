[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "imai-mlb-analytics"
version = "1.0.0"
description = "Reproducible course analysis of Tatsuya Imai's MLB adjustment decisions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.5",
  "pandas==3.0.1",
  "Pillow==12.3.0",
  "python-docx==1.2.0",
  "lxml==6.1.1",
  "pypdf==6.10.0",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
